/* ---------- Decoration components ---------- */

function MugguluDecoration({ corner = "top-left", opacity = 0.5, className = "" }) {
  const cornerClasses = {
    "top-left": "top-0 left-0",
    "top-right": "top-0 right-0 scale-x-[-1]",
    "bottom-left": "bottom-0 left-0 scale-y-[-1]",
    "bottom-right": "bottom-0 right-0 scale-x-[-1] scale-y-[-1]",
  };
  return (
    <img src={ASSETS.muggulu} alt="" aria-hidden="true" loading="lazy" draggable="false"
      style={{opacity, mixBlendMode:"multiply"}}
      className={`pointer-events-none select-none absolute w-28 sm:w-40 md:w-52 ${cornerClasses[corner]} ${className}`} />
  );
}

function GarlandDecoration({ side = "left", delay = 0, className = "" }) {
  const wrapperClasses = {
    left: "left-0 sm:left-4",
    right: "right-0 sm:right-4 scale-x-[-1]",
    center: "left-1/2 -translate-x-1/2",
  };
  return (
    <div aria-hidden="true" className={`pointer-events-none select-none absolute -top-2 sm:top-0 w-20 sm:w-28 md:w-36 ${wrapperClasses[side]} ${className}`}>
      <img src={ASSETS.garland} alt="" loading="lazy" draggable="false"
        style={{animationDelay:`${delay}ms`, transformOrigin:"top center"}}
        className="w-full wishly-garland-sway" />
    </div>
  );
}

function LotusDecoration({ className = "", flip = false }) {
  return (
    <img src={ASSETS.lotus} alt="" aria-hidden="true" loading="lazy" draggable="false"
      className={`pointer-events-none select-none absolute w-16 sm:w-24 ${flip ? "scale-x-[-1]" : ""} ${className}`} />
  );
}

function BapuIllustration({ className = "" }) {
  return (
    <div className={`mx-auto w-full max-w-[280px] sm:max-w-[340px] border border-[#b3872f]/50 p-2 bg-[#faf4e6] shadow-[0_10px_26px_rgba(58,42,29,0.18)] ${className}`}>
      <div className="border border-[#b3872f]/30 p-1">
        <img src={ASSETS.bapu} alt="Traditional illustration of a couple, hand in hand" loading="lazy" className="w-full h-auto" />
      </div>
    </div>
  );
}

const btnClass = "mt-10 inline-flex items-center gap-2 font-['Cormorant_Garamond'] italic font-semibold text-lg text-[#faf4e6] bg-gradient-to-b from-[#b9622f] to-[#9b4a22] px-8 py-3 border border-[#b3872f]/50 shadow-[0_6px_16px_rgba(74,21,28,0.25)] transition-transform duration-300 hover:-translate-y-0.5";

function Envelope({ to, onOpen }) {
  const [open, setOpen] = useState(false);
  function handleClick(){
    if(open) return;
    setOpen(true);
    window.setTimeout(()=> onOpen && onOpen(), 900);
  }
  return (
    <div className="flex flex-col items-center">
      <div className="relative w-[min(320px,78vw)] aspect-[3/2]" style={{perspective:"1200px"}}>
        <div className="absolute inset-0 bg-gradient-to-br from-[#f6ecd6] to-[#ecdcb8] border border-[#b3872f]/40 shadow-[0_14px_30px_rgba(58,42,29,0.22)]" />
        <div className="pointer-events-none absolute left-[6%] right-[6%] top-[10%] h-[80%] bg-[#faf4e6] shadow-[0_-4px_12px_rgba(58,42,29,0.15)] flex items-start justify-center pt-[16%] transition-transform duration-700 ease-out"
          style={{transform: open ? "translateY(20%)" : "translateY(96%)"}}>
          <span className="font-['Kalam'] text-[#4a151c] text-sm sm:text-base px-3 text-center">Dear {to},</span>
        </div>
        <div className="absolute top-0 left-0 w-full h-[60%] z-[3] bg-gradient-to-br from-[#f3e6c8] to-[#e6d0a0] border-b border-[#b3872f]/30 transition-transform duration-700 ease-out"
          style={{clipPath:"polygon(0 0, 100% 0, 50% 100%)", transformOrigin:"top center", transform: open ? "rotateX(180deg)" : "rotateX(0deg)"}} />
        <div className="absolute left-1/2 top-[36%] -translate-x-1/2 -translate-y-1/2 z-[4] w-11 h-11 rounded-full flex items-center justify-center bg-[radial-gradient(circle_at_35%_30%,#b9622f,#4a151c)] shadow-[0_3px_8px_rgba(0,0,0,0.3)] transition-opacity duration-300"
          style={{opacity: open ? 0 : 1}}>
          <svg viewBox="0 0 20 20" className="w-5 h-5">
            {[0,72,144,216,288].map(a => <ellipse key={a} cx="10" cy="6" rx="3.2" ry="2" fill="#f3e6c8" opacity="0.9" transform={`rotate(${a} 10 10)`} />)}
            <circle cx="10" cy="10" r="1.6" fill="#fff" />
          </svg>
        </div>
        <div className="absolute bottom-[12%] left-0 right-0 text-center z-[1]">
          <span className="font-['Kalam'] text-[#4a151c] text-base sm:text-lg">To {to} &hearts;</span>
        </div>
      </div>
      <button onClick={handleClick} disabled={open}
        className={`mt-10 inline-flex items-center gap-2 font-['Cormorant_Garamond'] italic font-semibold text-lg text-[#faf4e6] bg-gradient-to-b from-[#b9622f] to-[#9b4a22] px-8 py-3 border border-[#b3872f]/50 shadow-[0_6px_16px_rgba(74,21,28,0.25)] transition-all duration-300 ${open ? "opacity-0 pointer-events-none" : "opacity-100 hover:-translate-y-0.5"}`}>
        Open the Letter <span>&rarr;</span>
      </button>
    </div>
  );
}

function LoveLetter({ person1, person2, senderName, letterContent }){
  return (
    <div className="relative max-w-[560px] w-full mx-auto bg-[#faf4e6] shadow-[0_18px_44px_rgba(58,42,29,0.2)] border border-[#b3872f]/25 px-6 py-8 sm:px-10 sm:py-12 max-h-[58vh] overflow-y-auto">
      <div className="pointer-events-none absolute inset-[10px] border border-[#b3872f]/25" />
      <p className="font-['Cormorant_Garamond'] italic font-semibold text-2xl sm:text-3xl text-[#4a151c] mb-5">Dear {person1} &amp; {person2},</p>
      {letterContent.map((p,i) => <p key={i} className="font-['Lora'] text-[#3a2a1d] leading-[1.95] text-[0.98rem] sm:text-base mb-4">{p}</p>)}
      <p className="font-['Lora'] text-[#3a2a1d] leading-[1.95] mb-6">Happy Anniversary. &hearts;</p>
      <p className="font-['Kalam'] text-xl text-[#4a151c]">With lots of love,<br/>{senderName}</p>
    </div>
  );
}

const TILTS = ["-4deg","3deg","-2.5deg","2deg","-3.5deg","4deg"];

function PhotoAlbum({ photos }){
  const usable = photos.filter(p => p && p.src);
  const [openIndex, setOpenIndex] = useState(null);
  if(usable.length === 0){
    return <p className="font-['Lora'] italic text-[#5c4a38] text-sm max-w-xs mx-auto">Photos will appear here once added — this preview has none uploaded.</p>;
  }
  const cols = usable.length<=1 ? "grid-cols-1 max-w-[280px]" : usable.length<=2 ? "grid-cols-2 max-w-[420px]" : usable.length<=4 ? "grid-cols-2 max-w-[520px]" : "grid-cols-2 sm:grid-cols-3 max-w-[720px]";
  return (
    <>
      <div className={`grid ${cols} gap-x-4 gap-y-8 mx-auto`}>
        {usable.map((p,i) => (
          <button key={i} onClick={()=>setOpenIndex(i)} style={{transform:`rotate(${TILTS[i%TILTS.length]})`}}
            className="group bg-[#faf4e6] p-2 pb-8 relative text-left shadow-[0_10px_20px_rgba(58,42,29,0.2)] transition-transform duration-300 ease-out hover:-translate-y-1 hover:rotate-0">
            <div className="aspect-square overflow-hidden bg-[#e6d3ac]">
              <img src={p.src} alt={p.caption||""} loading="lazy" className="w-full h-full object-cover" />
            </div>
            {p.caption && <span className="absolute bottom-2 left-0 right-0 text-center font-['Kalam'] text-[#5c4a38] text-sm">{p.caption}</span>}
          </button>
        ))}
      </div>
      {openIndex !== null && (
        <div role="dialog" aria-modal="true" onClick={()=>setOpenIndex(null)} className="fixed inset-0 z-[900] bg-[#3a2a1d]/75 flex items-center justify-center p-6">
          <button onClick={()=>setOpenIndex(null)} aria-label="Close" className="fixed top-4 right-5 text-3xl leading-none font-['Cormorant_Garamond'] text-[#faf4e6]">&times;</button>
          <div onClick={(e)=>e.stopPropagation()} className="bg-[#faf4e6] p-4 pb-8 max-w-[480px] w-full shadow-[0_30px_60px_rgba(0,0,0,0.4)]">
            <img src={usable[openIndex].src} alt={usable[openIndex].caption||""} className="w-full h-auto max-h-[70vh] object-contain mb-3" />
            {usable[openIndex].caption && <p className="text-center font-['Kalam'] text-lg text-[#4a151c]">{usable[openIndex].caption}</p>}
          </div>
        </div>
      )}
    </>
  );
}

/* ---------- Orchestrator ---------- */

const PAGES = [AnniversaryIntro, JourneyPage, StoryPage, BapuArtPage, EnvelopePage, LetterPage, GalleryPage, FinalWishPage];

function PageTransition({ active, children }){
  return (
    <div aria-hidden={!active}
      className={`absolute inset-0 flex items-center justify-center transition-[opacity,transform] duration-500 ease-out ${active ? "opacity-100 translate-x-0 pointer-events-auto z-10" : "opacity-0 translate-x-2 pointer-events-none z-0"}`}>
      {children}
    </div>
  );
}

function AnniversaryTemplate(){
  const [index, setIndex] = useState(0);
  const goNext = () => setIndex(i => Math.min(i+1, PAGES.length-1));
  const goTo = (i) => setIndex(i);
  return (
    <div className="relative w-full h-screen overflow-hidden bg-[#f3ead8]">
      <div className="pointer-events-none absolute inset-0 opacity-[0.04] mix-blend-multiply"
        style={{backgroundImage:"radial-gradient(circle at 20% 15%, #b9622f 0%, transparent 55%), radial-gradient(circle at 85% 80%, #6d1f28 0%, transparent 55%)"}} />
      {PAGES.map((Page,i) => (
        <PageTransition active={i===index} key={i}>
          <Page config={defaultConfig} onNext={goNext} />
        </PageTransition>
      ))}
      <div className="fixed left-1/2 bottom-4 -translate-x-1/2 z-50 flex gap-1.5">
        {PAGES.map((_,i) => (
          <button key={i} onClick={()=>goTo(i)} aria-label={`Go to page ${i+1}`}
            className={`h-[5px] rounded-full transition-all duration-300 ${i===index ? "w-4 bg-[#9b4a22]" : "w-[5px] bg-[#9b4a22]/25"}`} />
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<AnniversaryTemplate />);

  const script = document.createElement("script");
  script.textContent = compiled;
